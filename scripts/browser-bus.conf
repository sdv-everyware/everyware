<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- browser-bus.conf: the browser's D-Bus session bus in the Debian root (the image has it in
     /vendor/etc/everyware/browser; run-browser-rb3.sh pushes it to /etc/har). It exists for one call, cogctl open (the relay
     har-browser-relay.sh -> Cog). Unlike Debian's session.conf: no service directories, so no
     client can start a service (dconf, PACRunner, systemd1 are installed); only Cog may own a
     name; the socket sits in the browser's own 0700 directory. -->
<busconfig>
  <type>session</type>
  <listen>unix:path=/tmp/har-dbus/bus</listen>
  <auth>EXTERNAL</auth>
  <policy context="default">
    <allow send_destination="*" eavesdrop="true"/>
    <allow eavesdrop="true"/>
    <deny own="*"/>
    <allow own="com.igalia.Cog"/>
  </policy>
</busconfig>
