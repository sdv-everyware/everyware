// The local link from the dashboard bundle to the harry process: the bundle is the gRPC
// client and pushes what the screen shows (the data of the house's topics) and a heartbeat;
// the harry process is the server on 127.0.0.1 (as HAR's HarSdvServiceBundle pushes to
// harry-app). The messages are the catalog's.

syntax = "proto3";

package com.everyware.dashboard;

import "matter.proto";
import "matter_service.proto";
import "news.proto";
import "weather.proto";
import "wifi.proto";
import "wifi_service.proto";

service DashboardService {
    // The weather of the house (topic "weather"), on every update and again after a reconnect.
    rpc PublishWeather(com.everyware.Weather) returns (Ack);
    // The news of the house (topic "news"), likewise.
    rpc PublishNews(com.everyware.NewsFeed) returns (Ack);
    // The thumbnail of a story of the feed (one of the topic "news-thumbnails"), likewise.
    rpc PublishNewsThumbnail(com.everyware.NewsThumbnail) returns (Ack);
    // The Wi-Fi of the house (topics "wifi-networks", "wifi-state"), likewise.
    rpc PublishWifiNetworks(com.everyware.WifiNetworks) returns (Ack);
    rpc PublishWifiState(com.everyware.WifiState) returns (Ack);
    // The screen's commands for the Wi-Fi bundle: the bridge opens this stream once it is
    // connected and calls the bundle's WifiService (wifi_service.proto) for every command.
    rpc WifiCommands(Subscribe) returns (stream com.everyware.WifiCommand);
    // The answer to a command, once the Wi-Fi bundle gave it (a connect: when the network
    // is joined or the attempt failed), or why the call did not get through.
    rpc PublishWifiResult(WifiCommandResult) returns (Ack);
    // The Matter devices of the house (topic "matter-devices"), on every update and again after
    // a reconnect.
    rpc PublishMatterDevices(com.everyware.MatterDevices) returns (Ack);
    // The screen's commands for the Matter bundle: the bridge opens this stream once it is
    // connected and calls the bundle's MatterService (matter_service.proto) for every command.
    rpc MatterCommands(Subscribe) returns (stream com.everyware.MatterCommand);
    // The answer to a command, once the device acknowledged it, or why not.
    rpc PublishMatterResult(MatterCommandResult) returns (Ack);
    // Once a second while the bundle runs: silence means the house's data is gone.
    rpc Heartbeat(HeartbeatRequest) returns (Ack);
}

message HeartbeatRequest {
    // Seconds since the bundle started.
    uint64 uptime_s = 1;
}

message Ack {}

message Subscribe {}

message MatterCommandResult {
    // Which command it answers: "pair", "on-off", "level", "setpoint", "system-mode", "fan-mode".
    string command = 1;
    uint64 node_id = 2;
    uint32 endpoint = 3;
    com.everyware.MatterResult result = 4;
}

message WifiCommandResult {
    // Which command it answers: "scan", "connect", "forget", "disconnect".
    string command = 1;
    // The SSID of a connect or forget.
    string ssid = 2;
    com.everyware.WifiResult result = 3;
}
