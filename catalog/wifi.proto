// The Wi-Fi of the house: what the Wi-Fi bundle publishes (the networks around, the state of
// the connection) and the commands it takes (bundles/wifi). The screen sees them through the
// dashboard bundle.
syntax = "proto3";

package com.everyware;

import "sdv/vsidl/v1/annotations.proto";

// How a network is protected.
enum WifiSecurity {
    WIFI_SECURITY_OPEN = 0;
    WIFI_SECURITY_WPA2 = 1;
    WIFI_SECURITY_WPA3 = 2;
    WIFI_SECURITY_ENTERPRISE = 3;
}

// A network of the last scan.
message WifiNetwork {
    string ssid = 1 [(.sdv.vsidl.v1.variable_type_max_size) = 32];
    WifiSecurity security = 2;
    // 1..4 bars, from the signal level.
    uint32 signal_bars = 3;
    int32 signal_dbm = 4;
    // A password is stored for it.
    bool saved = 5;
    // The device is on it.
    bool connected = 6;
}

// The networks around, strongest first.
message WifiNetworks {
    option (.sdv.vsidl.v1.publication) = {
        message_count: 4
        model: MULTI_PUB
    };
    repeated WifiNetwork networks = 1 [(.sdv.vsidl.v1.repeated_field_max_count) = 32];
}

// The connection.
enum WifiConnection {
    WIFI_DISCONNECTED = 0;
    WIFI_SCANNING = 1;
    WIFI_CONNECTING = 2;
    WIFI_CONNECTED = 3;
    // The last attempt failed (error says why); not connected.
    WIFI_FAILED = 4;
}

message WifiState {
    option (.sdv.vsidl.v1.publication) = {
        message_count: 4
        model: MULTI_PUB
    };
    WifiConnection connection = 1;
    // The network of the connection or the attempt.
    string ssid = 2 [(.sdv.vsidl.v1.variable_type_max_size) = 32];
    uint32 signal_bars = 3;
    // Why the last attempt failed ("wrong password", "network not found").
    string error = 4 [(.sdv.vsidl.v1.variable_type_max_size) = 64];
}

// What the screen asks the Wi-Fi bundle to do.
message WifiCommand {
    option (.sdv.vsidl.v1.publication) = {
        message_count: 8
        model: MULTI_PUB
    };
    oneof command {
        WifiScan scan = 1;
        WifiConnect connect = 2;
        WifiForget forget = 3;
        WifiDisconnect disconnect = 4;
    }
}

message WifiScan {}

message WifiConnect {
    string ssid = 1 [(.sdv.vsidl.v1.variable_type_max_size) = 32];
    // Empty for an open network and for a saved one.
    string psk = 2 [(.sdv.vsidl.v1.variable_type_max_size) = 64];
    WifiSecurity security = 3;
}

message WifiForget {
    string ssid = 1 [(.sdv.vsidl.v1.variable_type_max_size) = 32];
}

message WifiDisconnect {}
