[package]
name = "dcf-tools"
version = "0.1.0"
edition = "2021"
publish = false
description = "The .dcf tools of SDV EveryWare: dcf-fetch (Figma or a local document into a .dcf), dcf-diff"

[[bin]]
name = "dcf-fetch"
path = "src/fetch.rs"

[[bin]]
name = "dcf-diff"
path = "src/diff.rs"

[dependencies]
# DesignCompose's importer with EveryWare's changes (Document::from_local, a team library's
# component sets, the disk cache): the everyware branch of our fork of DesignCompose.
dc_figma_import = { git = "https://github.com/sdv-everyware/automotive-design-compose", branch = "everyware", features = ["fetch"] }
dc_bundle = { git = "https://github.com/sdv-everyware/automotive-design-compose", branch = "everyware" }
clap = { version = "4.5", features = ["derive", "env"] }
protobuf = "3.2"
env_logger = "0.10"
log = "0.4"

[workspace]
